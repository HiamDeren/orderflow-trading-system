<body data-page="home">
<main class="ui-main">
<div class="ui-content">

<section class="home-top">
  <h1 class="ui-h1">Orderflow Trading System</h1>
  <div class="sess" id="sess"></div>
</section>

<div style="margin-top:18px"><a class="cont" id="cont" href="levels.html#lo-trinh"></a></div>

<section class="ui-sec">
  <h2 class="ui-h2">Khoá học</h2>
  <div class="ui-grid ui-g2">
    <div class="course" id="course-levels" style="--c:var(--c-levels)">
      <div class="top"><span class="ico"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4v16"/><path d="M4 6h5M4 9.5h10M4 13h16M4 16.5h11M4 20h6"/></svg></span><div><h3>TPO Level Playbook</h3></div></div>
      <div class="chs"></div><div class="meters"></div>
      <div class="act"><a class="ui-btn primary" href="levels.html">Vào khoá</a><a class="ui-btn" href="quiz.html#luyen-tap">Luyện 93 câu</a></div>
    </div>
    <div class="course" id="course-tools" style="--c:var(--c-tools)">
      <div class="top"><span class="ico"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3v18M17 3v18"/><rect x="4.5" y="7" width="5" height="9" rx="1"/><rect x="14.5" y="5" width="5" height="7" rx="1"/></svg></span><div><h3>Orderflow Tools Playbook</h3></div></div>
      <div class="chs"></div><div class="meters"></div>
      <div class="act"><a class="ui-btn primary" href="tools.html">Vào khoá</a><a class="ui-btn" href="quiz.html#luyen-tap">Luyện 87 câu</a></div>
    </div>
  </div>
</section>

<section class="ui-sec">
  <div class="ui-sec-h"><h2 class="ui-h2">Trắc nghiệm</h2><a class="ui-btn sm" href="quiz.html">Mở trung tâm trắc nghiệm →</a></div>
  <div class="qstats" id="qstats"></div>
  <div class="tools-grid" id="ex-mini"></div>
</section>

<section class="ui-sec backup" id="backup">
  <h2 class="ui-h2">Sao lưu &amp; khôi phục tiến độ</h2>
  <div class="ui-card" style="display:grid;gap:12px">
    <div class="row"><button class="ui-btn sm" id="bk-copy" type="button">Copy mã tiến độ</button><button class="ui-btn sm" id="bk-export" type="button">Tải file .json</button></div>
    <textarea id="bk-text" placeholder="Dán mã tiến độ vào đây, hoặc để trống rồi bấm Khôi phục để chọn file .json" aria-label="Mã tiến độ"></textarea>
    <div class="row"><button class="ui-btn sm primary" id="bk-import" type="button">Khôi phục</button><input type="file" id="bk-file" accept="application/json,.json" hidden><button class="ui-btn sm ghost" id="bk-reset" type="button" style="margin-left:auto;color:var(--sell)">Xoá toàn bộ tiến độ</button></div>
  </div>
</section>

</div>
</main>
